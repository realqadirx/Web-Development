<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <table border="sloid">

        <thead>
            <caption>
                Student Information
            </caption>
        </thead>

        <tbody>
            <tr>
                <th rowspan="6">Info</th>
                <th rowspan="2">Name</th>
                <th colspan="2">Address</th>
            </tr>
            <tr>
                <th>City</th>
                <th>House</th>
            </tr>
            <tr>
                <td>A</td>
                <td>Delhi</td>
                <td>1</td>
            </tr>
            <tr>
                <td>B</td>
                <td>Mumbai</td>
                <td>2</td>
            </tr>
            <tr>
                <td>C</td>
                <td>Kolkata</td>
                <td>3</td>
            </tr>
            <tr>
                <td>D</td>
                <td>Pune</td>
                <td>4</td>
            </tr>
        </tbody>

    </table>


    <hr>


    <form action="/action">

        <div>
            Name: <input type="text" placeholder="Enter Your Name">
        </div>

        <div>
            sex: <input type="radio" id="Male" name="gender">
            <label for="Male">Male</label>

            <input type="radio" id="Female" name="gender">
            <label for="Female">Female</label>

            <input type="radio" id="other" name="gender">
            <label for="other">Other</label>
        </div>

        <div>
            country:
            <select name="country" id="country">
                <option>Select an option</option>
                <option value="IND">India</option>
                <option value="Nep">Nepal</option>
                <option value="USA">USA</option>
                <option value="Cana">Canada</option>
            </select>
        </div>

        <div>
            <label for="feedback">massage:</label>
            <br>
            <textarea name="feedback" id="feedback"></textarea>
        </div>

        <div>
            <input type="checkbox"> Subscribe?
        </div>

        <div>
            <button>Submit</button>
        </div>

    </form>


    <hr>

    <form action="/Qadir">

        <div>
            <h2>Feedback Form</h2>
        </div>

        <div>
            <label for="name">Name:</label>
            <input type="text" placeholder="Write your name" id="name">
        </div>
        <br>
        <div>
            <label for="Email">Email:</label>
            <input type="text" placeholder="Write your email" id="Email">
        </div>
        <br>
        <div>
            <label for="message">Message:</label>
            <br>
            <textarea name="Feedback" id="message"></textarea>
        </div>
        <br>
        <div>
            Rate us our of 5:

            <br>

            <input name="rating" type="radio" id="1">
            <label name="rating" for="1">1</label>

            <br>

            <input name="rating" id="2" type="radio">
            <label for="2">2</label>

            <br>

            <input name="rating" id="3" type="radio">
            <label for="3">3</label>

            <br>

            <input name="rating" id="4" type="radio">
            <label for="4">4</label>

            <br>

            <input name="rating" id="5" type="radio">
            <label for="5">5</label>

        </div>
        <div>
            <button>Send your message!</button>
        </div>
        </form>

</body>

</html>
